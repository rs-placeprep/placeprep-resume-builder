<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · R's PlacePrep Resume Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --background: 255 255 255;
        --foreground: 15 23 42;
        --muted-foreground: 100 116 139;
        --border: 226 232 240;
        --card: 255 255 255;
        --primary: 30 64 175;
        --primary-foreground: 255 255 255;
      }

      html.dark {
        --background: 10 10 11;
        --foreground: 250 250 250;
        --muted-foreground: 161 161 170;
        --border: 39 39 42;
        --card: 24 24 27;
        --primary: 59 130 246;
        --primary-foreground: 255 255 255;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: 'Inter', system-ui, sans-serif;
        background: rgb(var(--background));
        color: rgb(var(--foreground));
        text-align: center;
        padding: 24px;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 420px;
      }

      .code {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: rgb(var(--primary));
        margin: 0 0 16px;
      }

      h1 {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0 0 10px;
      }

      p {
        margin: 0 0 28px;
        line-height: 1.5;
        color: rgb(var(--muted-foreground));
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 40px;
        padding: 0 18px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 500;
        font-size: 14px;
        transition: opacity 0.15s ease;
      }

      a:hover {
        opacity: 0.85;
      }

      .btn-solid {
        background: rgb(var(--primary));
        color: rgb(var(--primary-foreground));
      }

      .btn-outline {
        border: 1px solid rgb(var(--border));
        color: rgb(var(--foreground));
      }
    </style>
    <script>
      try {
        var t = localStorage.getItem('resume-builder-theme')
        var isDark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (isDark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist or may have moved.</p>
      <div class="actions">
        <a class="btn-solid" href="/">Back to the resume builder</a>
        <a class="btn-outline" href="/guide/">Read the resume guide</a>
      </div>
    </main>
  </body>
</html>
