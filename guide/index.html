              {
                "@type": "Question",
                "name": "What should I write in a resume summary?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Two to three sentences covering who you are, your strongest proof point with a number in it, and what you are looking for. Skip adjectives like hardworking or passionate — they carry no information."
                }
              },
              {
                "@type": "Question",
                "name": "How do I write resume bullet points?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Use the pattern: action verb, what you built or changed, the measurable result, and how you did it. For example, 'Cut API p95 latency from 820ms to 210ms by adding Redis caching and batching N+1 queries' instead of 'Improved website performance'."
                }
              },
              {
                "@type": "Question",
                "name": "What if I have no numbers to show?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "You almost always have some. Count users, requests, records, test coverage, team size, time saved, bugs fixed, or before-and-after timings. If nothing is measurable, describe scope and technical difficulty concretely instead."
                }
              },
              {
                "@type": "Question",
                "name": "Should a resume be one page?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes for students, freshers and most people under roughly eight years of experience. Recruiters spend six to ten seconds on a first pass, so a second page usually dilutes rather than adds."
                }
              }
            ]
